name: Build Titanium ARM64

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (for example self-hosted or ubuntu-latest)"
        required: true
        type: string
        default: "self-hosted"

permissions:
  contents: read

concurrency:
  group: titanium-arm64-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
      STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Prepare scripts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./*.sh

      - name: Build ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh

      - name: Validate and stage APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(chromium/src/out/release/Titanium-*-arm64-v8a.apk)

          if [[ ${#apks[@]} -ne 1 || ! -s "${apks[0]}" ]]; then
            echo "Expected exactly one non-empty ARM64 APK at chromium/src/out/release/Titanium-*-arm64-v8a.apk; found ${#apks[@]}." >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi

          mkdir -p dist
          output="dist/$(basename "${apks[0]}")"
          cp "${apks[0]}" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Upload ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: titanium-arm64-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
